# Cooptimize agent — project contract (.coop/project.yml)
# Copy this file to <your-repo>/.coop/project.yml and replace every TODO.
# coop's skills, prompts, and the Cooptimize workflow treat this file as the single
# source of truth. coop reads it before any file work. Based on the original
# pi-analytics-agent agent-config.template.yml, extended for the Cooptimize stack.

profile:
  organization: "Cooptimize"
  client: "TODO: client / engagement"
  timezone: "America/Chicago"
  default_branch: "main"
  work_mode: "consultant_review_first"     # read-only first; plan + approval before edits

# --- Progressive estate coverage --------------------------------------------
# A new engagement may start with no local source, only one side, or selected
# folders. The /setup-project wizard maintains this block; users need not edit it.
estate:
  mode: "connected"                # discovery | partial | connected
  local_source_coverage:
    sql: "available"               # available | unknown | not_available_yet
    power_bi: "available"

# --- Repositories the agent may touch ----------------------------------------
repositories:
  fabric:
    description: "Semantic models, reports, and Fabric artifacts"
    role: "powerbi"
    local_path: "TODO: /path/to/fabric"
    remote_name: "origin"
    default_branch: "main"
    agent_allowed_to_commit:
      - "docs/**"
      - "site/**"
      - "docs/agent/logs/**"
      - "docs/agent/diagrams/**"
    agent_never_commit:
      - "**/*.pbip"
      - "**/*.pbir"
      - "**/*.bim"
      - "**/*.tmdl"
      - "**/*.dax"
      - "**/*.json"
      - "**/*.rdl"
      - "**/*.SemanticModel/**"
      - "**/*.Report/**"
  fabric_dw:
    description: "Warehouse / Lakehouse SQL"
    role: "sql"
    local_path: "TODO: /path/to/fabric-dw"
    remote_name: "origin"
    default_branch: "main"
    sql_root: "TODO: sql"
    agent_allowed_to_commit:
      - "docs/**"
      - "site/**"
      - "docs/agent/logs/**"
      - "docs/agent/diagrams/**"
    agent_never_commit:
      - "**/*.sql"
      - "**/*.py"
      - "**/*.ipynb"

# --- Microsoft Fabric ---------------------------------------------------------
fabric:
  tenant_id: "TODO: tenant id (Azure sign-in at launch; overrides ~/.coop/config azure.tenant_id)"
  default_workspace_name: "TODO: dev Warehouse / Lakehouse workspace name"
  default_workspace_id: "TODO: dev Warehouse / Lakehouse workspace id"
  # The Fabric item kinds that hold this client's SQL: warehouse, lakehouse,
  # sql_database or mixed (master plan C2). coop assumes nothing beyond it.
  layout: "warehouse"
  lakehouse_names: ["TODO: lakehouse"]
  warehouse_names: ["TODO: warehouse"]
  # Optional Warehouse/Lakehouse SQL endpoint MCP target. Leave IDs blank unless
  # copied from Fabric. Lakehouse targets use sqlEndpointProperties.id.
  default_sql_endpoint:
    item_type: ""
    item_name: ""
    item_id: ""
    sqlEndpointProperties:
      id: ""
  # Warehouse / Lakehouse workspace for each deployment environment.
  environment_names:
    dev:  "TODO: dev Warehouse / Lakehouse workspace"
    test: "TODO: test Warehouse / Lakehouse workspace"
    prod: "TODO: prod Warehouse / Lakehouse workspace"

# --- SQL connection targets (master plan SQ1) ----------------------------------
# One entry per environment; coop works on default_environment (dev or test,
# never prod) unless a session is explicitly scoped and approved for another.
# kind: fabric_warehouse | fabric_lakehouse | fabric_sql_database | azure_sql |
#       synapse_serverless. The server host must match the kind (Azure SQL is
#       *.database.windows.net); Fabric Warehouse / Lakehouse entries carry the
#       workspace_id + item_id (and sql_endpoint_id for a Lakehouse) instead of a
#       server, because coop discovers that host through the Fabric REST API.
# Entra ID tokens only: never a user, password or connection string here.
sql_targets:
  default_environment: dev
  dev:
    kind: azure_sql
    server: "TODO: contoso-dev.database.windows.net"
    database: "TODO: database"
  test:
    kind: azure_sql
    server: ""
    database: ""
  prod:
    kind: azure_sql
    server: ""
    database: ""

power_bi:
  default_workspace_name: "TODO: dev semantic-model workspace name"
  default_workspace_id: "TODO: dev semantic-model workspace id"
  # How a semantic-model table maps to the SQL object it loads (master plan C2).
  # rule same_name: the table is named like the view (dbo.vSales or vSales loads
  # dbo.vSales); rule prefix: table <name> loads default_schema.<view_prefix><name>.
  # overrides win over the rule: model table name -> schema.object. data_doc
  # lineage and sql_impact check this and report a mismatch, never "no dependents".
  table_mapping:
    rule: "same_name"
    default_schema: "dbo"
    view_prefix: ""
    overrides: {}
  # Semantic-model workspace for each deployment environment.
  environment_names:
    dev:  "TODO: dev semantic-model workspace"
    test: "TODO: test semantic-model workspace"
    prod: "TODO: prod semantic-model workspace"
  semantic_models:
    - name: "TODO: semantic model name"
      path: "TODO: relative path in fabric repo"
      workspace: "TODO: workspace name"
  reports:
    - name: "TODO: report name"
      path: "TODO: relative path in fabric repo"
      semantic_model: "TODO: semantic model name"
      app_category: "TODO: app/category"

# --- Tools --------------------------------------------------------------------
tools:
  fabric_cli:
    command: "fab"            # the Microsoft Fabric CLI (ms-fabric-cli)
    enabled: true
    default_mode: "read_only_first"
  fabric_cicd:
    # A Python LIBRARY (no CLI), injected into the Fabric CLI env via
    # `pipx inject ms-fabric-cli fabric-cicd`. Used as `import fabric_cicd` in
    # deployment scripts (validate-only by default), NOT a `fabric-cicd` command.
    library: "fabric_cicd"
    injected_into: "ms-fabric-cli"
    enabled: true
    default_mode: "validate_only"
  tabular_editor_cli:
    enabled: false
    executable_path: "te"
    bpa_rules_path: "TODO: path/to/BPARules.json"
  coop_data_doc:
    command: "coop-data-doc"
    enabled: true
    default_command: "build"
    machine_outputs: ["graph.json", "manifest.json"]

# --- MCP servers (all optional; edits ask first) ------------------------------
# Generated as manifest-pinned managed entries from ~/.coop/config by `coop sync`.
# coop NEVER performs write/create/update/delete/deploy MCP actions without
# explicit user approval, regardless of server capability.
mcp:
  fabric:
    enabled: true
  microsoft_learn:
    enabled: true
    purpose: "Always-current Microsoft documentation lookups"
  fabric_sqlendpoint:
    enabled: true

# --- Persistent memory (pi-hermes-memory) ------------------------------------
memory:
  extension: "pi-hermes-memory"
  enabled: true
  secret_scanning: true       # block secrets from being written to memory/output

# --- Official Microsoft agent skills (subordinate, opt-in) -------------------
# Official Microsoft agent skills are SUBORDINATE to Cooptimize skills: a
# Microsoft skill is surfaced only if the pinned catalog + current project policy
# allow it AND it does not conflict (by folder name or frontmatter name) with one
# of our own skills. `coop sync` refreshes the immutable catalog; launch uses the
# local last-known-good catalog only and never networks. Legacy source/load_dir
# fields are ignored if present.
microsoft_skills:
  policy: restricted
  allow:
    - "kql"             # KQL / Fabric Real-Time Intelligence (EventHouse/ADX)
    - "microsoft-docs"  # Microsoft Learn documentation queries

# Microsoft Skills for Fabric (Power BI / Fabric authoring). These skills can
# author PBIR, TMDL, SQL, notebooks, and Fabric items. They remain subordinate
# to Cooptimize skills and subject to the same guardrails: plan-and-approve
# before edits, show diff, and NEVER commit source.
fabric_skills:
  policy: baseline
  # Exact source/revision/path pins live in config/microsoft-skills.json.
  # Baseline enables every skill in the pinned microsoft/skills-for-fabric
  # catalog (v0.3.18). To load a subset instead, switch to `policy: restricted`
  # and list the skills, e.g.:
  #   - "sqldw-cli"
  #   - "eventhouse-cli"
  #   - "powerbi-report-cli"
  #   - "semantic-model-authoring"

# Standards: the canonical Cooptimize standards come from cooptimize/coop-standards
# (`coop sync`, `/standards-status`). Add an override only when this project has
# deliberately approved different standards for a domain. Use a single Markdown file per
# coop domain (sql, dax, or semantic_model), set as `path:`.
# standards:
#   sql:
#     path: "docs/standards/client-sql.md"

# --- Backups / logging / documentation ---------------------------------------
backup:
  root: ".backups"
  timestamp_format: "%Y%m%d_%H%M%S"
  naming_pattern: "{original_name}.{timestamp}.bak"
  required_before_edit: true

logging:
  daily_log_path: "docs/agent/logs/daily/{yyyy-mm-dd}.md"
  weekly_log_path: "docs/agent/logs/weekly/{yyyy}-W{ww}.md"
  require_task_log: true

documentation:
  agent_docs_root: "docs/agent"
  human_site_root: "site"
  glossary_path: "docs/agent/glossary/index.md"
  diagrams_path: "docs/agent/diagrams"
  source_of_truth: "markdown_first_html_generated"
  use_coop_data_doc: true     # step 3 of the workflow calls coop-data-doc

# --- Workflow + governance ----------------------------------------------------
workflow:
  skill: "coop-workflow"      # the workflow grounding skill
  steps:
    - "Read .coop/project.yml + COOP's resolved standards task authority"
    - "Identify repo/object + upstream/downstream impact; git status && git pull"
    - "Read target file(s) + related docs/lineage (coop-data-doc)"
    - "Write a short PLAN and get explicit review/approval before any edit"
    - "Create a timestamped backup of every file to be changed"
    - "Make the smallest safe edit"
    - "Self-check the change against the standards articles used to write it (name any rule it could not meet); Tabular Editor BPA / fabric-cicd validate where relevant"
    - "Show git diff + summarize the change"
    - "Update Markdown docs / glossary / lineage; regenerate site if docs changed"
    - "Append to the daily log"
    - "Commit docs/logs/site ONLY with approval; never commit source"

approval_policy:
  always_allowed:
    - "read files"
    - "git status / git diff / git pull"
    - "create backups"
    - "run coop-data-doc / Tabular Editor BPA (advisory)"
    - "MCP dev/test metadata / schema / artifact-code list / read / inspect"
    - "update markdown docs, html site, logs"
  ask_first:
    - "read actual rows from a live environment"
    - "read production metadata or artifact code"
    - "read production rows with target / columns / filters / limit"
    - "delete files"
    - "fabric-cicd deploy / run deployment"
    - "change production workspace"
    - "commit documentation changes"
  never_without_explicit_instruction:
    - "commit SQL/DAX/model/report source changes"
    - "push to remote"
    - "deploy to test/prod"
    - "MCP create/update/delete/deploy/publish"
    - "delete Fabric / Power BI artifacts"
    - "print secrets, tokens, connection strings, or .env contents"

# --- Live-data tests between slices (optional) -------------------------------
# Enable only if the repo has safe, fast integration tests against dev/test data.
# The `command` is an optional default runner; each slice still defines its own
# specific test. coop will ask before running unless require_approval is false.
tests:
  live_data:
    enabled: false
    between_slices: true
    command: "TODO: pytest tests/integration"   # optional default runner
    workspace: "dev"          # dev or test only — never prod
    require_approval: true
