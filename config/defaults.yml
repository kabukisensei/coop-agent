# coop-agent behavior defaults: only keys something reads live here.
#
# Members and pins: config/release-manifest.json (the one manifest: Pi, the Pi
# extensions, the Coop tools, the Fabric CLI and its runtime libraries, the npm
# authoring tools and the MCP packages). This file carries no second copy of any
# version or member list. The MCP policy is docs/tool-contract.md and
# lib/mcp_config.py; the Fabric CLI notes (the `fab` collision, fabric-cicd as a
# library) are docs/troubleshooting.md and README.md.

# Branded resources scripts/context-budget.py measures (bin/coop.ps1 resolves
# the launch resources itself).
resources:
  skills: skills
  prompts: prompts
  guardrails: docs/guardrails.md

# The oldest Pi whose extension API coop's extensions still work with. `coop doctor`
# warns when the installed Pi is older; the Pi coop ships with is the manifest's
# pi.version, and `coop update` pins to it (--edge is the only latest/upstream path).
tested_with:
  pi_min: "0.79.0"

# fleet.publish_dir may be set here or in ~/.coop/config for `coop doctor --publish`
# and the fleet digest; unset by default.
