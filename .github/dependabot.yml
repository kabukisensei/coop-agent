# Keeps the commit-SHA pins on GitHub Actions current: one grouped PR a week
# when any action in .github/workflows/ has a newer release.
# npm: one entry per directory that contains a package.json. Minor and patch
# updates are grouped; each directory allows five open pull requests, the
# limit the github-actions entry uses by leaving the option unset.
# config/extensions-lock.json, config/pi-lock.json and config/desktop-lock.json
# are npm lockfiles under names Dependabot does not read, so they are not
# entries. There is no pip or NuGet manifest in this repo.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
