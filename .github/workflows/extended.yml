name: extended

# The extended test lane (#96): the full suite, gate lane plus the timing and
# process fixtures (sleeps, polls, PTY, marker files, hang and watchdog cases,
# network). COOP_TEST_EXTENDED=1 is the whole switch; with it unset, tests/run.sh
# and tests/run.ps1 run only the gate lane that ci.yml runs on every PR.
# Runs nightly, on demand (Actions -> extended -> Run workflow, any branch), and
# on a PR only when this file changes. See docs/ci.md, "coop-agent's own CI
# (maintainers): gate and extended lanes".

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/extended.yml

permissions:
  contents: read

# Never shared with ci.yml's groups. A newer push to the same PR cancels the
# older run; nightly and manual runs queue instead of cancelling.
concurrency:
  group: extended-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: logic tests, extended (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COOP_TEST_EXTENDED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
      # The terminal-workstation acceptance tests validate receipts against the
      # committed JSON schema and treat python jsonschema as mandatory (#133).
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install receipt-schema dependency
        run: python3 -m pip install --disable-pip-version-check --no-input "jsonschema==4.25.1"
      - name: run test suite, gate + extended lanes (bash tests/run.sh)
        run: |
          if [ "${COOP_TEST_EXTENDED:-}" != "1" ]; then echo "::error::COOP_TEST_EXTENDED did not reach bash"; exit 1; fi
          bash tests/run.sh
      - name: PowerShell behavioral tests, gate + extended lanes (pwsh)
        shell: pwsh
        run: |
          if ($env:COOP_TEST_EXTENDED -ne '1') { Write-Host '::error::COOP_TEST_EXTENDED did not reach pwsh'; exit 1 }
          pwsh -File tests/run.ps1

  tests-windows:
    name: logic tests, extended (Windows Git Bash)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      COOP_TEST_EXTENDED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Pin Python and install receipt-schema dependency
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'coop-ci-python'
          & python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $venv 'Scripts\python.exe'
          & $python -m pip install --disable-pip-version-check --no-input "jsonschema==4.25.1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -c "import jsonschema,os,sys; print(os.path.abspath(sys.executable))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sitePackages = (& $python -c "import jsonschema,os; print(os.path.dirname(os.path.dirname(jsonschema.__file__)))").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $sitePackages) { exit 1 }
          "CERT_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONPATH=$sitePackages" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: run test suite under Git Bash, gate + extended lanes
        shell: bash
        run: |
          if [ "${COOP_TEST_EXTENDED:-}" != "1" ]; then echo "::error::COOP_TEST_EXTENDED did not reach Git Bash"; exit 1; fi
          bash tests/run.sh

  windows:
    name: PowerShell 5.1 tests, extended (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      COOP_TEST_EXTENDED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Pin Python and install receipt-schema dependency
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'coop-ci-python'
          & python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $venv 'Scripts\python.exe'
          & $python -m pip install --disable-pip-version-check --no-input "jsonschema==4.25.1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -c "import jsonschema,os,sys; print(os.path.abspath(sys.executable))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sitePackages = (& $python -c "import jsonschema,os; print(os.path.dirname(os.path.dirname(jsonschema.__file__)))").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $sitePackages) { exit 1 }
          "CERT_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONPATH=$sitePackages" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # Same runtime bin/coop.cmd launches: Windows PowerShell 5.1, not pwsh 7.
      # The child powershell.exe inherits COOP_TEST_EXTENDED from this step.
      - name: PowerShell behavioral tests, gate + extended lanes (Windows PowerShell 5.1)
        shell: powershell
        run: |
          if ($env:COOP_TEST_EXTENDED -ne '1') { Write-Host '::error::COOP_TEST_EXTENDED did not reach Windows PowerShell 5.1'; exit 1 }
          powershell -NoProfile -File tests\run.ps1

  # Master plan row 11a (DD4): the data_doc wrapper and the /setup-docs JSONL wizard
  # against the REAL coop-data-doc at its manifest pin, through real Windows pipes,
  # launched from Windows PowerShell 5.1 the way bin/coop.cmd launches Pi. Pi's own
  # exec (the pinned @earendil-works/pi-coding-agent) spawns the companion; the
  # fixture is a synthetic mixed estate with non-ASCII folder, file and object
  # names. No client data, network beyond the package installs, or credentials.
  datadoc-windows:
    name: data_doc + /setup-docs live, Windows PowerShell 5.1 (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      COOP_TEST_EXTENDED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # pipx, as coop install does: coop-data-doc.exe is pipx's launcher, never a
      # .cmd shim. PIPX_HOME/PIPX_BIN_DIR stay under the runner temp folder.
      - name: Install coop-data-doc at the manifest pin (pipx) and the pinned Pi
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -Raw -Encoding UTF8 config\release-manifest.json | ConvertFrom-Json
          $pin = $manifest.python_tools.'coop-data-doc'
          $piVersion = $manifest.pi.version
          $venv = Join-Path $env:RUNNER_TEMP 'pipx-venv'
          & python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $venv 'Scripts\python.exe'
          & $python -m pip install --disable-pip-version-check --no-input pipx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PIPX_HOME = Join-Path $env:RUNNER_TEMP 'pipx-home'
          $env:PIPX_BIN_DIR = Join-Path $env:RUNNER_TEMP 'pipx-bin'
          & $python -m pipx install "coop-data-doc==$pin"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path $env:PIPX_BIN_DIR 'coop-data-doc.exe'
          if (-not (Test-Path -LiteralPath $exe)) { Write-Host "::error::pipx did not create $exe"; exit 1 }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PIPX_BIN_DIR | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $piRoot = Join-Path $env:RUNNER_TEMP 'pi'
          New-Item -ItemType Directory -Force -Path $piRoot | Out-Null
          & npm.cmd install --prefix $piRoot --ignore-scripts --no-audit --no-fund --loglevel=error "@earendil-works/pi-coding-agent@$piVersion"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "COOP_TEST_PI_ROOT=$piRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Bundle coop-tools (as tests/run.sh does)
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'coop-dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          & npx.cmd -y esbuild extensions/coop-tools/index.ts --bundle --format=esm --platform=node --packages=external "--alias:typebox=$PWD\tests\typebox-stub.mjs" "--outfile=$dist\coop-tools.mjs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "COOP_TEST_DIST=$dist" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # Windows PowerShell 5.1 -> node -> coop-data-doc.exe, the coop.cmd process
      # chain, with the runner's default code page and no PYTHONUTF8. The test home
      # is a temp folder so standards hooks never touch the runner profile.
      - name: Live data_doc + /setup-docs acceptance (Windows PowerShell 5.1)
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { Write-Host "::error::expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"; exit 1 }
          Remove-Item Env:PYTHONUTF8, Env:PYTHONIOENCODING -ErrorAction SilentlyContinue
          $testHome = Join-Path $env:RUNNER_TEMP 'coop-test-home'
          New-Item -ItemType Directory -Force -Path $testHome | Out-Null
          $env:USERPROFILE = $testHome
          $env:HOME = $testHome
          $env:COOP_TEST_DATADOC_REQUIRED = '1'
          Write-Host "ANSI code page: $([System.Text.Encoding]::Default.WebName); console: $([Console]::OutputEncoding.WebName)"
          & node tests\datadoc-live.test.mjs
          exit $LASTEXITCODE
