name: ci

# The PR gate lane (#96). Every job here runs the fast, deterministic checks;
# the timing and process fixtures run in extended.yml (nightly + on demand) and
# the live Pi install in pi-matrix.yml. The `gate` job at the bottom is the one
# stable check that summarizes this workflow. See docs/ci.md, "coop-agent's own
# CI (maintainers): gate and extended lanes".

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR cancels the older run; pushes to main never cancel
# each other (each one is its own group).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shell:
    name: shell + config lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: bash -n (syntax)
        # Dev tooling only: the product runs in PowerShell (master plan S1). The
        # forwarder, release.sh and the test harness are the bash that remains.
        run: for f in bin/coop scripts/*.sh tests/*.sh; do echo "checking $f"; bash -n "$f"; done
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S warning -e SC1091 bin/coop scripts/*.sh tests/*.sh
      - name: python yaml reader
        run: |
          python3 -c "import ast; ast.parse(open('lib/_yaml.py').read())"
          test "$(python3 lib/_yaml.py get .coop/project.yml profile.organization MISS)" = "Cooptimize"
      - name: python extdeps helper
        # NB: this step runs under `bash -e`, so capture the intentionally-nonzero
        # exit codes with `|| rc=$?` (a list context, exempt from set -e) rather than
        # `cmd; test "$?"` — the bare `cmd` would abort the step before the test runs.
        run: |
          python3 -c "import ast; ast.parse(open('lib/_extdeps.py').read())"
          # no extension tree -> exit 2 (nothing to do)
          rc=0; python3 lib/_extdeps.py align /tmp/coop-no-such-dir 0.0.0 --check || rc=$?
          test "$rc" -eq 2
          # bad usage -> exit 3
          rc=0; python3 lib/_extdeps.py 2>/dev/null || rc=$?
          test "$rc" -eq 3
          # write + report on a fixture: overrides written, skew reported (exit 10)
          d="$(mktemp -d)"; mkdir -p "$d/npm/node_modules/@earendil-works/pi-ai" "$d/npm/node_modules/@earendil-works/pi-tui"
          printf '{"version":"0.74.2"}' > "$d/npm/node_modules/@earendil-works/pi-ai/package.json"
          printf '{"version":"0.74.2"}' > "$d/npm/node_modules/@earendil-works/pi-tui/package.json"
          printf '{"name":"pi-extensions","dependencies":{}}' > "$d/npm/package.json"
          rc=0; out="$(python3 lib/_extdeps.py align "$d" 0.80.2)" || rc=$?
          test "$rc" -eq 10
          # 8-field line: tree_ai tree_tui ovr_ai ovr_tui changed aligned required_floor offending_ext
          # (last two are "-" here: nothing imposes a pi-ai floor, so the agent is not "too old")
          test "$out" = "0.74.2 0.74.2 0.80.2 0.80.2 1 0 - -"
          python3 -c "import json,sys; o=json.load(open(sys.argv[1]))['overrides']; assert o['@earendil-works/pi-ai']=='0.80.2' and o['@earendil-works/pi-tui']=='0.80.2'" "$d/npm/package.json"
          # agent too old for an installed extension -> exit 11, names the offending ext + floor
          e="$(mktemp -d)"; mkdir -p "$e/npm/node_modules/@earendil-works/pi-ai" "$e/npm/node_modules/@earendil-works/pi-tui" "$e/npm/node_modules/@earendil-works/pi-coding-agent" "$e/npm/node_modules/pi-hermes-memory"
          printf '{"version":"0.80.2"}' > "$e/npm/node_modules/@earendil-works/pi-ai/package.json"
          printf '{"version":"0.80.2"}' > "$e/npm/node_modules/@earendil-works/pi-tui/package.json"
          printf '{"name":"pi-hermes-memory","dependencies":{"@earendil-works/pi-ai":"^0.99.0"}}' > "$e/npm/node_modules/pi-hermes-memory/package.json"
          # npm can auto-install a newer peer host at the top level. It is not an
          # extension and must not override the direct extension's requirement.
          printf '{"name":"@earendil-works/pi-coding-agent","dependencies":{"@earendil-works/pi-ai":"^0.99.1"}}' > "$e/npm/node_modules/@earendil-works/pi-coding-agent/package.json"
          printf '{"name":"pi-extensions","dependencies":{"pi-hermes-memory":"0.0.0"}}' > "$e/npm/package.json"
          rc=0; out="$(python3 lib/_extdeps.py align "$e" 0.80.2 --check)" || rc=$?
          test "$rc" -eq 11
          test "$out" = "0.80.2 0.80.2 - - 0 1 0.99.0 pi-hermes-memory"
      - name: validate JSON
        run: for f in $(find . -name '*.json' -not -path './node_modules/*' -not -path './.git/*'); do echo "$f"; python3 -m json.tool "$f" >/dev/null; done
      - name: validate YAML
        run: |
          python3 -m pip install --quiet pyyaml
          for f in $(find . -name '*.yml' -not -path './.git/*'); do echo "$f"; python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" "$f"; done
      - name: validate skills + prompts
        run: bash scripts/validate-resources.sh

  extensions:
    name: extensions transpile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
      - name: esbuild check (mirrors how Pi loads .ts extensions)
        run: |
          for f in extensions/*/index.ts; do
            echo "transpiling $f"
            npx -y esbuild "$f" --bundle --format=esm --platform=node --packages=external --outfile=/dev/null
          done

  tests:
    # Gate lane only (COOP_TEST_EXTENDED unset). The full suite runs in
    # extended.yml and in the `coop release` pre-tag gate.
    name: logic tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
      - name: run test suite, gate lane (bash tests/run.sh)
        run: bash tests/run.sh
      - name: PowerShell behavioral tests, gate lane (pwsh 7; starts with scripts/check-bom.ps1)
        shell: pwsh
        run: pwsh -File tests/run.ps1

  tests-windows:
    # Windows is coop's ONLY deployment target. Git Bash on windows-latest runs
    # tests/run.sh unchanged (bash + node + npx + pwsh all present), gate lane only
    # here: the Node and Python logic tests and the bash-harness suites.
    name: logic tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Pin Python and install receipt-schema dependency
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'coop-ci-python'
          & python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $venv 'Scripts\python.exe'
          & $python -m pip install --disable-pip-version-check --no-input "jsonschema==4.25.1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -c "import jsonschema,os,sys; print(os.path.abspath(sys.executable))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sitePackages = (& $python -c "import jsonschema,os; print(os.path.dirname(os.path.dirname(jsonschema.__file__)))").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $sitePackages) { exit 1 }
          "CERT_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONPATH=$sitePackages" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: run test suite under Git Bash, gate lane
        shell: bash
        run: bash tests/run.sh

  windows:
    name: powershell parse (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Pin Python and install receipt-schema dependency
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'coop-ci-python'
          & python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $venv 'Scripts\python.exe'
          & $python -m pip install --disable-pip-version-check --no-input "jsonschema==4.25.1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -c "import jsonschema,os,sys; print(os.path.abspath(sys.executable))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sitePackages = (& $python -c "import jsonschema,os; print(os.path.dirname(os.path.dirname(jsonschema.__file__)))").Trim()
          if ($LASTEXITCODE -ne 0 -or -not $sitePackages) { exit 1 }
          "CERT_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHONPATH=$sitePackages" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: parse every .ps1 with the PowerShell language parser
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch 'node_modules' } |
            ForEach-Object {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
              if ($errors) {
                Write-Host "PARSE ERRORS in $($_.FullName):"
                $errors | ForEach-Object { Write-Host "  $_" }
                $failed = $true
              } else {
                Write-Host "ok: $($_.FullName)"
              }
            }
          if ($failed) { exit 1 }

      # Parse EVERY .ps1 under Windows PowerShell 5.1 too — the runtime bin/coop.cmd,
      # the Install shortcut, and install.ps1's Start-Menu/Desktop shortcuts all invoke
      # (System32\WindowsPowerShell\v1.0\powershell.exe), not pwsh 7. The pwsh step above
      # accepts PS-7-only syntax (ternary `? :`, `??`, `?.`, `clean{}`) that is a HARD
      # parse error on 5.1 — so an agent editing .ps1 on macOS (pwsh only) could land a
      # 7-ism that sails CI green and then breaks `coop` at launch for the whole fleet.
      # This step is the 5.1 floor. (Same parser API; runs under Windows PowerShell 5.1.)
      - name: parse every .ps1 under Windows PowerShell 5.1 (the runtime coop.cmd uses)
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch 'node_modules' } |
            ForEach-Object {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
              if ($errors) {
                Write-Host "5.1 PARSE ERRORS in $($_.FullName):"
                $errors | ForEach-Object { Write-Host "  $_" }
                $failed = $true
              } else {
                Write-Host "ok (5.1): $($_.FullName)"
              }
            }
          if ($failed) { exit 1 }

      - name: PSScriptAnalyzer (errors only)
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $issues = Get-ChildItem -Recurse -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch 'node_modules' } |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error }
          if ($issues) {
            $issues | Format-Table -AutoSize | Out-String | Write-Host
            exit 1
          }
          Write-Host "PSScriptAnalyzer: no errors"

      # Behavioral tests of the product under Windows PowerShell 5.1 — the runtime
      # bin/coop.cmd actually launches (not pwsh 7): the .ps1 BOM check, coop.ps1's
      # launch-spec / --no-launch / review parser, update.ps1 --check and the fixture
      # table, the closest production fidelity for coop's ONLY platform. (The ubuntu
      # `tests` job runs the same file under pwsh 7 for the cross-edition check.)
      # Gate lane only; the full 5.1 run is in extended.yml.
      - name: PowerShell behavioral tests, gate lane (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -File tests\run.ps1

  installer:
    # The coop window package (master plan D1c, D1d): stage the pinned Node,
    # Pi, the extension tree and the repository snapshot, build the unsigned
    # NSIS per-user installer on every PR as an artifact, then install it
    # silently on this disposable runner, run `coop.exe --doctor`, check the
    # bundled runtime, run the bundled `coop.ps1 version` and uninstall
    # (desktop/scripts/verify-installer.mjs refuses to run anywhere else).
    name: installer (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
      - name: install electron-builder (desktop/installer, pinned)
        shell: pwsh
        working-directory: desktop/installer
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: build the installer (stage + electron-builder, unsigned)
        shell: pwsh
        run: node desktop/scripts/build-installer.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: coop-window-installer
          path: desktop/installer/dist/coop-window-*.exe
          if-no-files-found: error
          retention-days: 14
      - name: silent install, coop.exe --doctor, silent uninstall
        shell: pwsh
        env:
          COOP_INSTALLER_TEST: '1'
        run: node desktop/scripts/verify-installer.mjs --output "$env:RUNNER_TEMP\installer-acceptance.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coop-window-installer-acceptance
          path: ${{ runner.temp }}/installer-acceptance.json
          if-no-files-found: ignore

  gate:
    # The one stable check name for this workflow. It needs every job above and
    # fails unless each one finished with `success`, so a failed, cancelled or
    # skipped job fails it too. Add any new ci.yml job to `needs` here.
    name: gate
    if: always()
    needs: [shell, extensions, tests, tests-windows, windows, installer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every gate job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS_JSON"
          if [ -z "$RESULTS" ]; then
            echo "::error::gate: no job results to check"
            exit 1
          fi
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::gate: a required job finished with '$r' (per-job results above)"
              exit 1
            fi
          done
          echo "gate: every job succeeded ($RESULTS)"
