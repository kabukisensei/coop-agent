name: ci

# The PR gate lane (#96). Every job here runs the fast, deterministic checks;
# the timing and process fixtures run in extended.yml (nightly + on demand). The
# `gate` job at the bottom is the one stable check that summarizes this
# workflow. See docs/ci.md, "coop-agent's own CI (maintainers): gate and
# extended lanes".
#
# Lane layout (suite review 2026-10-26, pick 4): a PR runs lint, the logic
# suites on ubuntu, the Windows PowerShell 5.1 checks, and the installer build
# with its install/doctor/uninstall acceptance. The upgrade, shortcut-launch and
# one-liner acceptance (five more install cycles on one runner) runs on every
# push to main and in release.yml on the tag build, not on every PR.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR cancels the older run; pushes to main never cancel
# each other (each one is its own group).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shell:
    name: shell + config lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: bash -n (syntax)
        # Dev tooling only: the product runs in PowerShell (master plan S1). The
        # forwarder, release.sh and the test harness are the bash that remains.
        run: for f in bin/coop scripts/*.sh tests/*.sh; do echo "checking $f"; bash -n "$f"; done
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S warning -e SC1091 bin/coop scripts/*.sh tests/*.sh
      - name: python yaml reader
        run: |
          python3 -c "import ast; ast.parse(open('lib/_yaml.py').read())"
          # -S -I: no site-packages, so PyYAML cannot be there; coop's parser is the one parser.
          test "$(python3 -S -I lib/_yaml.py get .coop/project.yml profile.organization MISS)" = "Cooptimize"
          test "$(python3 -S -I lib/_yaml.py get .coop/project.yml tools.fabric_cli.enabled MISS)" = "true"
          python3 -S -I -c "import sys; sys.path.insert(0, 'lib'); import _yaml; d = _yaml.loads('a: true\nb: null\nc: 12\nd: 1.5\ne: \"true\"\n'); assert d == {'a': True, 'b': None, 'c': 12, 'd': 1.5, 'e': 'true'}, d; assert 'yaml' not in sys.modules"
      # lib/_extdeps.py's exit codes and report line are covered by
      # tests/extdeps-agent-pin.test.sh (run by tests/run.sh in the `tests` job).
      - name: validate JSON
        run: for f in $(find . -name '*.json' -not -path './node_modules/*' -not -path './.git/*'); do echo "$f"; python3 -m json.tool "$f" >/dev/null; done
      - name: validate YAML
        run: |
          python3 -m pip install --quiet pyyaml
          for f in $(find . -name '*.yml' -not -path './.git/*'); do echo "$f"; python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" "$f"; done
      - name: validate skills + prompts
        run: bash scripts/validate-resources.sh

  tests:
    # Gate lane only (COOP_TEST_EXTENDED unset). The full suite runs in
    # extended.yml and in the `coop release` pre-tag gate. The Windows Git Bash
    # leg of tests/run.sh runs nightly in extended.yml: the suites are
    # platform-neutral logic, and the `windows` and `installer` jobs below
    # exercise the product itself on Windows on every PR.
    name: logic tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
      - name: esbuild check of every extension (mirrors how Pi loads .ts extensions)
        run: |
          for f in extensions/*/index.ts; do
            echo "transpiling $f"
            npx -y esbuild "$f" --bundle --format=esm --platform=node --packages=external --outfile=/dev/null
          done
      - name: run test suite, gate lane (bash tests/run.sh)
        run: bash tests/run.sh
      - name: PowerShell behavioral tests, gate lane (pwsh 7; starts with scripts/check-bom.ps1)
        shell: pwsh
        run: pwsh -File tests/run.ps1

  windows:
    # Windows is coop's ONLY deployment target, and bin/coop.cmd runs Windows
    # PowerShell 5.1 (System32\WindowsPowerShell\v1.0\powershell.exe), not pwsh 7.
    # Everything here runs under 5.1: the parse floor, the analyzer and the
    # behavioral suite. (pwsh 7 accepts PS-7-only syntax - ternary `? :`, `??`,
    # `?.`, `clean{}` - that is a HARD parse error on 5.1, so an agent editing
    # .ps1 on macOS could land a 7-ism that breaks `coop` at launch for the whole
    # fleet; the `tests` job above runs tests/run.ps1 under pwsh 7 for the
    # cross-edition check.)
    name: powershell 5.1 (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: parse every .ps1 under Windows PowerShell 5.1 (the runtime coop.cmd uses)
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch 'node_modules' } |
            ForEach-Object {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
              if ($errors) {
                Write-Host "5.1 PARSE ERRORS in $($_.FullName):"
                $errors | ForEach-Object { Write-Host "  $_" }
                $failed = $true
              } else {
                Write-Host "ok (5.1): $($_.FullName)"
              }
            }
          if ($failed) { exit 1 }

      - name: PSScriptAnalyzer module (pinned, cached)
        id: analyzer-cache
        uses: actions/cache@v4
        with:
          path: ~\Documents\PowerShell\Modules\PSScriptAnalyzer
          key: psscriptanalyzer-1.24.0
      - name: install PSScriptAnalyzer
        if: steps.analyzer-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
      - name: PSScriptAnalyzer (errors only)
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer -RequiredVersion 1.24.0
          $issues = Get-ChildItem -Recurse -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch 'node_modules' } |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error }
          if ($issues) {
            $issues | Format-Table -AutoSize | Out-String | Write-Host
            exit 1
          }
          Write-Host "PSScriptAnalyzer: no errors"

      # Behavioral tests of the product under Windows PowerShell 5.1 — the runtime
      # bin/coop.cmd actually launches: the .ps1 BOM check, coop.ps1's launch-spec /
      # --no-launch / review parser, update.ps1 --check and the fixture table, the
      # closest production fidelity for coop's ONLY platform. Gate lane only; the
      # full 5.1 run is in extended.yml.
      - name: PowerShell behavioral tests, gate lane (Windows PowerShell 5.1)
        shell: powershell
        run: powershell -NoProfile -File tests\run.ps1

  installer:
    # The coop window package (master plan D1c, D1d): stage the pinned Node,
    # Pi, the extension tree and the repository snapshot, build the unsigned
    # NSIS per-machine installer (F3) on every PR as an artifact, run the
    # guardrails against the staged Pi (the one real-Pi check), then install
    # the package silently for every account on this disposable runner, check
    # the machine shim, PATH entry and "coop update" task, run the auto-update
    # dry run, `coop.exe --doctor`, check the bundled runtime, run the bundled
    # `coop.ps1 version` and uninstall (desktop/scripts/verify-installer.mjs
    # refuses to run anywhere else). The downloads are SHA-pinned in the
    # manifest, so the download cache is keyed on the manifest.
    name: installer (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
      - name: cache electron-builder (desktop/installer/node_modules)
        uses: actions/cache@v4
        with:
          path: desktop/installer/node_modules
          key: installer-node-modules-${{ hashFiles('desktop/installer/package-lock.json') }}
      - name: cache the verified runtime downloads (desktop/installer/cache)
        uses: actions/cache@v4
        with:
          path: desktop/installer/cache
          key: installer-downloads-${{ hashFiles('config/release-manifest.json') }}
      - name: install electron-builder (desktop/installer, pinned)
        shell: pwsh
        working-directory: desktop/installer
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: build the installer (stage + electron-builder, unsigned)
        shell: pwsh
        run: node desktop/scripts/build-installer.mjs
      - name: guardrails through Pi's own extension runner (the staged, pinned Pi)
        shell: pwsh
        run: node tests/guardrails-pi-runner.test.mjs "$PWD\desktop\installer\runtime\npm\node_modules\@earendil-works\pi-coding-agent"
      - uses: actions/upload-artifact@v4
        with:
          name: coop-window-installer
          path: desktop/installer/dist/coop-window-*.exe
          if-no-files-found: error
          retention-days: 14
      - name: silent install, coop.exe --doctor, silent uninstall
        shell: pwsh
        env:
          COOP_INSTALLER_TEST: '1'
          # F3: the auto-update dry run asks api.github.com; a token keeps a shared runner address off the unauthenticated rate limit.
          GH_TOKEN: ${{ github.token }}
        run: node desktop/scripts/verify-installer.mjs --output "$env:RUNNER_TEMP\installer-acceptance.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coop-window-installer-acceptance
          path: ${{ runner.temp }}/installer-acceptance.json
          if-no-files-found: ignore

  installer-upgrade:
    # Upgrade acceptance (master plan D1k; Aaron 2026-10-07: the one installer
    # must work for people who already have coop, and its "coop" shortcut must
    # open the window; F3: one install per machine): the latest release's
    # installer for this account, then this build for every account over it;
    # then this build over a terminal install (this checkout). Shortcuts, the
    # `coop` link, the machine shim and task, the profile and the next launch's
    # setup are checked (desktop/scripts/verify-upgrade.mjs refuses to run
    # anywhere else). Runs on every push to main (and in release.yml on the tag
    # build); a PR runs the build and the install acceptance above. Dispatch
    # the job by hand on a PR that changes the upgrade or launch path:
    # desktop/scripts/verify-upgrade.mjs, verify-launch.mjs, scripts/bootstrap.ps1,
    # the installer's NSIS script, or the first-launch setup.
    name: installer upgrade (Windows)
    needs: [installer]
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
      - uses: actions/download-artifact@v4
        with:
          name: coop-window-installer
          path: ${{ runner.temp }}/current
      - name: download the latest release's installer and acceptance report
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$env:GITHUB_REPOSITORY" --pattern 'coop-window-*.exe' --pattern 'installer-acceptance.json' --dir "$env:RUNNER_TEMP\previous"
      - name: previous release, then this build over it; this build over a terminal install
        shell: pwsh
        env:
          COOP_INSTALLER_TEST: '1'
        run: node desktop/scripts/verify-upgrade.mjs --previous "$env:RUNNER_TEMP\previous" --dist "$env:RUNNER_TEMP\current" --output "$env:RUNNER_TEMP\upgrade-acceptance.json"
      - name: double-click the "coop" shortcut; a window must open (picker, then first-launch setup and the window)
        shell: pwsh
        env:
          COOP_INSTALLER_TEST: '1'
        run: node desktop/scripts/verify-launch.mjs --dist "$env:RUNNER_TEMP\current" --output "$env:RUNNER_TEMP\launch-acceptance.json"
      - name: the one-liner (irm | iex form) installs the latest release, then finds it installed
        shell: pwsh
        env:
          COOP_BOOTSTRAP_NO_LAUNCH: '1'
        run: |
          $ps = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $cmd = "Invoke-Expression ([System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes('scripts\bootstrap.ps1')))"
          $first = (& $ps -NoLogo -NoProfile -ExecutionPolicy Bypass -Command $cmd 2>&1 | Out-String)
          Write-Output $first
          if ($first -match 'is not recognized' -or $first -notmatch "SHA-256 matches the release's acceptance report" -or $first -notmatch 'the coop window is installed') { throw 'the one-liner did not download, verify and install the latest release' }
          $second = (& $ps -NoLogo -NoProfile -ExecutionPolicy Bypass -Command $cmd 2>&1 | Out-String)
          Write-Output $second
          if ($second -notmatch 'is already installed') { throw 'a second run of the one-liner did not find the window installed' }
      - name: the acceptance reports in the log (what a failed launch saw, windows and processes)
        if: always()
        shell: pwsh
        run: |
          foreach ($f in @("$env:RUNNER_TEMP\upgrade-acceptance.json", "$env:RUNNER_TEMP\launch-acceptance.json")) {
            if (Test-Path -LiteralPath $f) { Write-Output "--- $f"; Get-Content -LiteralPath $f -Raw }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coop-window-upgrade-acceptance
          path: |
            ${{ runner.temp }}/upgrade-acceptance.json
            ${{ runner.temp }}/launch-acceptance.json
          if-no-files-found: ignore

  gate:
    # The one stable check name for this workflow. It needs every job above and
    # fails unless each one finished with `success`, so a failed, cancelled or
    # skipped job fails it too. The one exception is `installer-upgrade`, which
    # runs only on a push to main: on a pull request its `skipped` passes. Add
    # any new ci.yml job to `needs` here.
    name: gate
    if: always()
    needs: [shell, tests, windows, installer, installer-upgrade]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every gate job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SHELL_RESULT: ${{ needs.shell.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          INSTALLER_RESULT: ${{ needs.installer.result }}
          UPGRADE_RESULT: ${{ needs.installer-upgrade.result }}
          EVENT: ${{ github.event_name }}
        run: |
          printf '%s\n' "$NEEDS_JSON"
          rc=0
          for job in "shell=$SHELL_RESULT" "tests=$TESTS_RESULT" "windows=$WINDOWS_RESULT" "installer=$INSTALLER_RESULT"; do
            if [ "${job#*=}" != "success" ]; then echo "::error::gate: ${job%%=*} finished with '${job#*=}'"; rc=1; fi
          done
          case "$UPGRADE_RESULT" in
            success) ;;
            skipped) if [ "$EVENT" = "pull_request" ]; then echo "gate: installer-upgrade runs on every push to main, not on a pull request"; else echo "::error::gate: installer-upgrade was skipped on a $EVENT"; rc=1; fi ;;
            *) echo "::error::gate: installer-upgrade finished with '$UPGRADE_RESULT'"; rc=1 ;;
          esac
          if [ "$rc" -ne 0 ]; then exit 1; fi
          echo "gate: every job succeeded"
