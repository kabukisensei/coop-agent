name: release

# When `coop release` pushes a vX.Y.Z tag, publish a GitHub Release whose body is
# that version's section from CHANGELOG.md — so release notes are automatic —
# with the coop window installer attached (master plan D1c), so teammates
# download it from the release page. The installer is published only after the
# whole acceptance has passed against these exact bytes (#277): install
# silently, `coop.exe --doctor`, uninstall, profile untouched (the ci.yml PR
# job), then the previous release upgraded to this build, this build over a
# terminal install, the "coop" shortcut opening a window, and the one-liner
# (the ci.yml push-to-main job).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  installer:
    # The same build the ci.yml `installer (Windows)` job runs on every PR:
    # the unsigned per-user NSIS installer of the window, from this tag.
    name: build the coop window installer
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'
      - name: install electron-builder (desktop/installer, pinned)
        shell: pwsh
        working-directory: desktop/installer
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: build the installer (stage + electron-builder, unsigned)
        shell: pwsh
        run: node desktop/scripts/build-installer.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: coop-window-installer
          path: desktop/installer/dist/coop-window-*.exe
          if-no-files-found: error
          retention-days: 14
      # The acceptance the PR job runs, on the bytes that will be published: a
      # failure fails this job, so `release` (needs: installer) never runs and
      # nothing is published. The report (installer SHA-256, package version,
      # every step) is kept whether it passed or failed.
      - name: silent install, coop.exe --doctor, silent uninstall (the release bytes)
        shell: pwsh
        env:
          COOP_INSTALLER_TEST: '1'
          # F3: the auto-update dry run asks api.github.com; a token keeps a shared runner address off the unauthenticated rate limit.
          GH_TOKEN: ${{ github.token }}
        run: node desktop/scripts/verify-installer.mjs --output "$env:RUNNER_TEMP\installer-acceptance.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coop-window-installer-acceptance
          path: ${{ runner.temp }}/installer-acceptance.json
          if-no-files-found: error
          retention-days: 90
      # The upgrade, shortcut-launch and one-liner acceptance ci.yml runs on every
      # push to main, on the release bytes: the previous release (the latest one
      # published) upgraded to this build, this build over a terminal install,
      # the Desktop "coop" shortcut opening a window, and the `irm | iex`
      # one-liner installing the latest release. A failure here also keeps the
      # release from being published.
      - name: download the latest release's installer and acceptance report
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\current" | Out-Null
          Copy-Item desktop\installer\dist\coop-window-*.exe "$env:RUNNER_TEMP\current"
          gh release download --repo "$env:GITHUB_REPOSITORY" --pattern 'coop-window-*.exe' --pattern 'installer-acceptance.json' --dir "$env:RUNNER_TEMP\previous"
      - name: previous release, then this build over it; this build over a terminal install
        shell: pwsh
        env:
          COOP_INSTALLER_TEST: '1'
        run: node desktop/scripts/verify-upgrade.mjs --previous "$env:RUNNER_TEMP\previous" --dist "$env:RUNNER_TEMP\current" --output "$env:RUNNER_TEMP\upgrade-acceptance.json"
      - name: double-click the "coop" shortcut; a window must open
        shell: pwsh
        env:
          COOP_INSTALLER_TEST: '1'
        run: node desktop/scripts/verify-launch.mjs --dist "$env:RUNNER_TEMP\current" --output "$env:RUNNER_TEMP\launch-acceptance.json"
      - name: the one-liner (irm | iex form) installs the latest release, then finds it installed
        shell: pwsh
        env:
          COOP_BOOTSTRAP_NO_LAUNCH: '1'
        run: |
          $ps = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $cmd = "Invoke-Expression ([System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes('scripts\bootstrap.ps1')))"
          $first = (& $ps -NoLogo -NoProfile -ExecutionPolicy Bypass -Command $cmd 2>&1 | Out-String)
          Write-Output $first
          if ($first -match 'is not recognized' -or $first -notmatch "SHA-256 matches the release's acceptance report" -or $first -notmatch 'the coop window is installed') { throw 'the one-liner did not download, verify and install the latest release' }
          $second = (& $ps -NoLogo -NoProfile -ExecutionPolicy Bypass -Command $cmd 2>&1 | Out-String)
          Write-Output $second
          if ($second -notmatch 'is already installed') { throw 'a second run of the one-liner did not find the window installed' }
      - name: the acceptance reports in the log
        if: always()
        shell: pwsh
        run: |
          foreach ($f in @("$env:RUNNER_TEMP\upgrade-acceptance.json", "$env:RUNNER_TEMP\launch-acceptance.json")) {
            if (Test-Path -LiteralPath $f) { Write-Output "--- $f"; Get-Content -LiteralPath $f -Raw }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coop-window-upgrade-acceptance
          path: |
            ${{ runner.temp }}/upgrade-acceptance.json
            ${{ runner.temp }}/launch-acceptance.json
          if-no-files-found: ignore
          retention-days: 90

  release:
    name: GitHub Release
    needs: [installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the guard below needs origin/main's history
      - uses: actions/setup-node@v5
        with:
          node-version: '22.19.0'

      # `coop release` tags only from main == origin/main and pushes branch + tag
      # atomically, but a tag pushed by hand skips that. Teammates follow release
      # tags (H5), so refuse to publish one that isn't VERSION or isn't on main.
      - name: Refuse a tag that isn't VERSION or isn't on origin/main
        run: |
          want="v$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($want); publish only tags cut by coop release"
            exit 1
          fi
          commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME ($commit) is not on origin/main; publish only tags cut by coop release"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches VERSION and is on origin/main"

      - name: Extract changelog section for this tag
        run: |
          ver="${GITHUB_REF_NAME#v}"
          # Print lines under "## [<ver>]" up to (not including) the next "## [" heading.
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/        { exit }
            grab                    { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            printf "Release %s. See CHANGELOG.md.\n" "$GITHUB_REF_NAME" > RELEASE_NOTES.md
          fi
          echo "----- notes for $GITHUB_REF_NAME -----"; cat RELEASE_NOTES.md

      - uses: actions/download-artifact@v4
        with:
          name: coop-window-installer
          path: installer
      - uses: actions/download-artifact@v4
        with:
          name: coop-window-installer-acceptance
          path: installer

      # Publish only the executable the acceptance passed on: the report must say
      # ok and name this file's SHA-256 and this tag's version.
      - name: Refuse an installer the acceptance did not pass on
        run: node desktop/scripts/check-installer-report.mjs installer/installer-acceptance.json installer

      - name: Create GitHub Release
        # SHA-pinned (v3.0.1) — this is a third-party action with `contents: write`, so
        # a movable tag is the sharpest supply-chain edge in the whole workflow.
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          name: "coop-agent ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          files: |
            installer/coop-window-*.exe
            installer/installer-acceptance.json
          fail_on_unmatched_files: true
