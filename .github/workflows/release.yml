name: release

# When `coop release` pushes a vX.Y.Z tag, publish a GitHub Release whose body is
# that version's section from CHANGELOG.md — so release notes are automatic —
# with the coop window installer attached (master plan D1c), so teammates
# download it from the release page. The installer is published only after the
# whole acceptance has passed against these exact bytes (#277): install
# silently, `coop.exe --doctor`, uninstall, profile untouched (the ci.yml PR
# job), then the previous release upgraded to this build, this build over a
# terminal install, the "coop" shortcut opening a window, and the one-liner
# (the ci.yml push-to-main job).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  installer:
    # The same build the ci.yml `installer (Windows)` job runs on every PR:
    # the unsigned per-user NSIS installer of the window, from this tag.
    name: build the coop window installer
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
      - name: install electron-builder (desktop/installer, pinned)
        shell: pwsh
        working-directory: desktop/installer
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: build the installer (stage + electron-builder, unsigned)
        shell: pwsh
        run: node desktop/scripts/build-installer.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coop-window-installer
          path: desktop/installer/dist/coop-window-*.exe
          if-no-files-found: error
          retention-days: 14
      # The acceptance the PR job runs, on the bytes that will be published: a
      # failure fails this job, so `release` (needs: installer) never runs and
      # nothing is published. The report (installer SHA-256, package version,
      # every step) is kept whether it passed or failed.
      - name: silent install, coop.exe --doctor, silent uninstall (the release bytes)
        shell: pwsh
        env:
          COOP_INSTALLER_TEST: '1'
          # F3: the auto-update dry run asks api.github.com; a token keeps a shared runner address off the unauthenticated rate limit.
          GH_TOKEN: ${{ github.token }}
        run: node desktop/scripts/verify-installer.mjs --output "$env:RUNNER_TEMP\installer-acceptance.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coop-window-installer-acceptance
          path: ${{ runner.temp }}/installer-acceptance.json
          if-no-files-found: error
          retention-days: 90
  upgrade:
    # The upgrade, shortcut-launch and one-liner acceptance ci.yml runs on every
    # push to main, on the release bytes: the previous release (the latest one
    # published) upgraded to this build, this build over a terminal install, the
    # Desktop "coop" shortcut opening a window, and the `irm | iex` one-liner
    # installing the latest release. Its own runner, as in ci.yml: the install
    # cycle in `installer` leaves C:\Program Files\coop behind, and
    # verify-upgrade.mjs refuses a runner where coop was ever installed (the
    # v0.38.8 tag run failed exactly there). A failure here also keeps the
    # release from being published.
    name: upgrade, shortcut and one-liner acceptance
    needs: [installer]
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coop-window-installer
          path: ${{ runner.temp }}/current
      - name: download the latest release's installer and acceptance report
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$env:GITHUB_REPOSITORY" --pattern 'coop-window-*.exe' --pattern 'installer-acceptance.json' --dir "$env:RUNNER_TEMP\previous"
      - name: previous release, then this build over it; this build over a terminal install
        shell: pwsh
        env:
          COOP_INSTALLER_TEST: '1'
        run: node desktop/scripts/verify-upgrade.mjs --previous "$env:RUNNER_TEMP\previous" --dist "$env:RUNNER_TEMP\current" --output "$env:RUNNER_TEMP\upgrade-acceptance.json"
      - name: double-click the "coop" shortcut; a window must open
        shell: pwsh
        env:
          COOP_INSTALLER_TEST: '1'
        run: node desktop/scripts/verify-launch.mjs --dist "$env:RUNNER_TEMP\current" --output "$env:RUNNER_TEMP\launch-acceptance.json"
      - name: the one-liner (irm | iex form) finds the latest release once, installs it, then finds it installed
        shell: pwsh
        env:
          COOP_BOOTSTRAP_NO_LAUNCH: '1'
        run: |
          $ps = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $cmd = "Invoke-Expression ([System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes('scripts\bootstrap.ps1')))"
          # The live latest-release lookup, once (#517): a release published
          # between the two runs below must not turn a correct upgrade into a
          # failed repeat-install check, so both runs install this one version.
          $env:COOP_BOOTSTRAP_RESOLVE_ONLY = '1'
          $lookup = (& $ps -NoLogo -NoProfile -ExecutionPolicy Bypass -Command $cmd 2>&1 | Out-String)
          Remove-Item Env:\COOP_BOOTSTRAP_RESOLVE_ONLY
          Write-Output $lookup
          if ($lookup -match 'is not recognized' -or $lookup -notmatch 'the newest release is coop (\d+\.\d+\.\d+)') { throw 'the one-liner could not read the newest release from github.com' }
          $pinned = $Matches[1]
          $env:COOP_BOOTSTRAP_VERSION = $pinned
          $first = (& $ps -NoLogo -NoProfile -ExecutionPolicy Bypass -Command $cmd 2>&1 | Out-String)
          Write-Output $first
          if ($first -match 'is not recognized' -or $first -notmatch "coop $([regex]::Escape($pinned)) \(pinned by COOP_BOOTSTRAP_VERSION\)" -or $first -notmatch "SHA-256 matches the release's acceptance report" -or $first -notmatch 'the coop window is installed') { throw "the one-liner did not download, verify and install release $pinned" }
          # A release from before #520 never writes the machine-setup record the
          # same-version shortcut reads, so its second run finishes the setup
          # again instead; that run must still succeed.
          # (A record left by this build's earlier install names another version.)
          $record = Join-Path $env:ProgramData 'coop\machine-setup.json'
          $legacy = $true
          try { if ([string]((Get-Content -LiteralPath $record -Raw -ErrorAction Stop | ConvertFrom-Json).version) -eq $pinned) { $legacy = $false } } catch { }
          $second = (& $ps -NoLogo -NoProfile -ExecutionPolicy Bypass -Command $cmd 2>&1 | Out-String)
          Write-Output $second
          if ($second -notmatch "the coop window $([regex]::Escape($pinned)) is already installed") {
            if (-not ($legacy -and $second -match "the coop window $([regex]::Escape($pinned)) is installed but its machine setup did not finish" -and $second -match 'the coop window is installed')) { throw "a second run of the one-liner did not find release $pinned installed" }
            Write-Output "release $pinned predates the machine-setup record (#520): the second run finished its setup again and succeeded"
          }
      - name: the acceptance reports in the log
        if: always()
        shell: pwsh
        run: |
          foreach ($f in @("$env:RUNNER_TEMP\upgrade-acceptance.json", "$env:RUNNER_TEMP\launch-acceptance.json")) {
            if (Test-Path -LiteralPath $f) { Write-Output "--- $f"; Get-Content -LiteralPath $f -Raw }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coop-window-upgrade-acceptance
          path: |
            ${{ runner.temp }}/upgrade-acceptance.json
            ${{ runner.temp }}/launch-acceptance.json
          if-no-files-found: ignore
          retention-days: 90

  release:
    name: GitHub Release
    needs: [installer, upgrade]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.notes.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the guard below needs origin/main's history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'

      # `coop release` tags only from main == origin/main and pushes branch + tag
      # atomically, but a tag pushed by hand skips that. Teammates follow release
      # tags (H5), so refuse to publish one that isn't VERSION or isn't on main.
      - name: Refuse a tag that isn't VERSION or isn't on origin/main
        run: |
          want="v$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($want); publish only tags cut by coop release"
            exit 1
          fi
          commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME ($commit) is not on origin/main; publish only tags cut by coop release"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches VERSION and is on origin/main"

      - name: Extract changelog section for this tag
        id: notes
        run: |
          ver="${GITHUB_REF_NAME#v}"
          # Print lines under "## [<ver>]" up to (not including) the next "## [" heading.
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## \[/        { exit }
            grab                    { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            printf "Release %s. See CHANGELOG.md.\n" "$GITHUB_REF_NAME" > RELEASE_NOTES.md
          fi
          echo "----- notes for $GITHUB_REF_NAME -----"; cat RELEASE_NOTES.md
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          { echo "notes<<COOP_NOTES_EOF"; cat RELEASE_NOTES.md; echo "COOP_NOTES_EOF"; } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coop-window-installer
          path: installer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coop-window-installer-acceptance
          path: installer

      # Publish only the executable the acceptance passed on: the report must say
      # ok and name this file's SHA-256 and this tag's version.
      - name: Refuse an installer the acceptance did not pass on
        run: node desktop/scripts/check-installer-report.mjs installer/installer-acceptance.json installer

      - name: Create GitHub Release
        # SHA-pinned (v3.0.1) — this is a third-party action with `contents: write`, so
        # a movable tag is the sharpest supply-chain edge in the whole workflow.
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: "coop-agent ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
          files: |
            installer/coop-window-*.exe
            installer/installer-acceptance.json
          fail_on_unmatched_files: true

  website:
    # After the GitHub Release exists, ask private coop-website to open the docs
    # sync pull request. A public repository cannot `uses:` that repository's
    # reusable workflow (the v0.38.7 tag run died at planning), so this is
    # repository_dispatch event_type coop-release, client_payload {repo, tag}
    # (coop-website PR #105). This workflow has no workflow_dispatch and no
    # inputs.tag: the only trigger is `push` of a `v*` tag, which is also the
    # release job's only gate (that job has no `if:`), so this job has no `if:`
    # either. TAG is github.ref_name (vX.Y.Z). The release job's version output
    # drops the leading v, and the receiver accepts only ^v\d+\.\d+\.\d+$.
    # COOP_WEBSITE_DISPATCH_TOKEN is a fine-grained PAT for
    # kabukisensei/coop-website only, Contents read and write. No secret: a
    # notice, exit 0; the release is already published. permissions is empty
    # because the call uses that secret, not GITHUB_TOKEN.
    name: dispatch the coop-website sync
    needs: [release]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Dispatch coop-release
        env:
          DISPATCH_TOKEN: ${{ secrets.COOP_WEBSITE_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [ -z "${DISPATCH_TOKEN}" ]; then
            echo "::notice title=coop-website sync skipped::No COOP_WEBSITE_DISPATCH_TOKEN secret. The release is published. Run the sync-release workflow in kabukisensei/coop-website by hand (repo: ${repo}, tag: ${TAG})."
            exit 0
          fi
          if [ -z "${TAG}" ]; then echo "::error::No release tag to send."; exit 1; fi
          payload="$(jq -n --arg repo "$repo" --arg tag "$TAG" '{event_type:"coop-release",client_payload:{repo:$repo,tag:$tag}}')"
          curl --fail-with-body --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "${payload}" \
            "https://api.github.com/repos/kabukisensei/coop-website/dispatches"
