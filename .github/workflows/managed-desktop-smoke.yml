name: managed desktop smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/managed-desktop-smoke.yml'
      - 'desktop/**'
      - 'bin/**'
      - 'config/**'
      - 'extensions/**'
      - 'lib/**'
      - 'prompts/**'
      - 'scripts/**'
      - 'skills/**'
      - 'themes/**'
      - 'vibes/**'
      - 'web/**'
      - 'VERSION'

permissions:
  contents: read

jobs:
  managed-runtime:
    name: managed runtime (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Read exact development companion commits
        id: companions
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const pins = JSON.parse(fs.readFileSync('config/development-companions.json', 'utf8'));
          for (const [name, output] of [['coop-data-doc', 'data'], ['coop-sql-review', 'sql'], ['coop-dax-review', 'dax']]) {
            if (!/^[0-9a-f]{40}$/.test(pins[name])) throw new Error(`Invalid companion pin: ${name}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${output}=${pins[name]}\n`);
          }
          NODE
      - uses: actions/checkout@v5
        with:
          repository: kabukisensei/coop-data-doc
          ref: ${{ steps.companions.outputs.data }}
          path: development-sources/coop-data-doc-desktop
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: kabukisensei/coop-sql-review
          ref: ${{ steps.companions.outputs.sql }}
          path: development-sources/coop-sql-review-desktop
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: kabukisensei/coop-dax-review
          ref: ${{ steps.companions.outputs.dax }}
          path: development-sources/coop-dax-review-desktop
          persist-credentials: false
      - name: Build wheels from the committed companion snapshots
        shell: bash
        run: python scripts/build-development-wheels.py --repositories '${{ github.workspace }}/development-sources' --output '${{ runner.temp }}/coop-development-wheels'
      - name: Install pinned Desktop build dependencies
        run: npm ci --prefix desktop
      - name: Diagnose Windows PowerShell with an isolated environment and input handles
        if: runner.os == 'Windows'
        shell: bash
        run: node desktop/scripts/diagnose-windows-shell.mjs --output '${{ runner.temp }}/windows-shell-diagnostics.json'
      - name: Determine native managed-runtime target
        id: target
        shell: bash
        run: echo "value=$(node -p 'process.platform+"-"+process.arch')" >> "$GITHUB_OUTPUT"
      - name: Build checksum-pinned managed runtime with development companions
        shell: bash
        run: node scripts/prepare-managed-runtime.mjs --target '${{ steps.target.outputs.value }}' --work '${{ runner.temp }}/coop-managed-work' --output '${{ runner.temp }}/managed-runtime' --development-wheels '${{ runner.temp }}/coop-development-wheels/development-wheels.json'
      - name: Verify real runtime, exact capabilities, isolated state, and cleanup
        shell: bash
        run: node scripts/verify-managed-runtime.mjs --bundle '${{ runner.temp }}/managed-runtime' --workspace '${{ github.workspace }}' --agent '${{ runner.temp }}/coop-managed-agent' | tee '${{ runner.temp }}/managed-runtime-check.json'
      - name: Package unsigned native development app
        if: runner.os == 'macOS'
        shell: bash
        env:
          COOP_DESKTOP_MANAGED_RUNTIME_DIR: ${{ runner.temp }}/managed-runtime
        run: npm run package:managed:mac --prefix desktop
      - name: Package unsigned native development app
        if: runner.os == 'Windows'
        shell: bash
        env:
          COOP_DESKTOP_MANAGED_RUNTIME_DIR: ${{ runner.temp }}/managed-runtime
        run: npm run package:managed:win --prefix desktop
      - name: Verify packaged fuses, ASAR boundary, and embedded runtime
        shell: bash
        run: npm run verify:managed-package --prefix desktop --silent | tee '${{ runner.temp }}/managed-package-check.json'
      - name: Exercise the runtime from inside the native package
        shell: bash
        run: |
          node --input-type=module - <<'NODE' | tee '${{ runner.temp }}/packaged-runtime-check.json'
          import { spawnSync } from 'node:child_process';
          import { join, resolve } from 'node:path';
          import { packagedPaths } from './desktop/scripts/verify-managed-package.mjs';
          const resources = packagedPaths(resolve('desktop/dist-managed')).resources;
          const result = spawnSync(process.execPath, ['scripts/verify-managed-runtime.mjs',
            '--bundle', join(resources, 'managed-runtime'), '--workspace', process.env.GITHUB_WORKSPACE,
            '--agent', join(process.env.RUNNER_TEMP, 'coop-packaged-agent')], { stdio: 'inherit' });
          if (result.error) throw result.error;
          process.exitCode = result.status ?? 1;
          NODE
      - name: Probe explicit modules through runtime dispatcher
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { join, resolve } from 'node:path';
          import { packagedPaths } from './desktop/scripts/verify-managed-package.mjs';
          import { buildNativeProbeEnvironment } from './desktop/scripts/verify-native-application.mjs';
          const resources = packagedPaths(resolve('desktop/dist-managed')).resources;
          const runtime = join(resources, 'managed-runtime');
          const profile = join(process.env.RUNNER_TEMP, 'probe7-native-profile');
          const agent = join(process.env.RUNNER_TEMP, 'probe7-agent');
          const workspace = join(process.env.RUNNER_TEMP, 'probe7-workspace');
          const env = buildNativeProbeEnvironment(profile, undefined, 'win32', process.env);
          delete env.COOP_DESKTOP_UPDATE_PROBE;
          Object.assign(env, { COOP_DESKTOP_AGENT_DIR: agent, COOP_AGENT_DIR: agent, PI_CODING_AGENT_DIR: agent, COOP_SKIP_AZ: '1', COOP_NO_ONBOARD: '1', COOP_RUNTIME_STARTUP_TRACE: '1' });
          for (const path of [profile, env.TEMP, env.APPDATA, env.LOCALAPPDATA, agent, workspace]) mkdirSync(path, { recursive: true });
          function run(name, command, args, runEnv = env) {
            const result = spawnSync(command, args, { cwd: workspace, env: runEnv, shell: false, windowsHide: true, timeout: 10000, encoding: 'utf8', maxBuffer: 64 * 1024 });
            return { name, status: result.status, signal: result.signal, errorCode: result.error?.code || null,
              stdout: String(result.stdout || ''), stderr: String(result.stderr || ''), pid: result.pid || null };
          }
          const powershell = join(process.env.SystemRoot, 'System32', 'WindowsPowerShell', 'v1.0', 'powershell.exe');
          const builtInModules = join(process.env.SystemRoot, 'System32', 'WindowsPowerShell', 'v1.0', 'Modules');
          const builtInEnv = { ...env, PSModulePath: builtInModules };
          const commandArgs = script => ['-NoLogo', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-Command', script];
          const psQuote = value => `'${String(value).replaceAll("'", "''")}'`;
          const dispatcherScript = imports => `${imports}; & ${psQuote(join(runtime, 'coop', 'bin', 'coop.ps1'))} runtime --transport http --json --port 0 --cwd ${psQuote(workspace)}`;
          const results = [
            run('managed-mcp-config', join(runtime, 'node', 'node.exe'), [join(runtime, 'coop', 'lib', 'managed-mcp-config.mjs'), runtime, agent]),
            run('cmdlet-native-module-path', powershell, commandArgs("[Console]::Error.WriteLine('phase:enter'); Split-Path -Parent 'C:\\probe\\file.txt'; [Console]::Error.WriteLine('phase:done')")),
            run('cmdlet-built-in-module-path', powershell, commandArgs("[Console]::Error.WriteLine('phase:enter'); Split-Path -Parent 'C:\\probe\\file.txt'; [Console]::Error.WriteLine('phase:done')"), builtInEnv),
            run('explicit-management-import', powershell, commandArgs("[Console]::Error.WriteLine('phase:enter'); Import-Module Microsoft.PowerShell.Management; [Console]::Error.WriteLine('phase:imported'); Split-Path -Parent 'C:\\probe\\file.txt'; [Console]::Error.WriteLine('phase:done')"), builtInEnv),
            run('dotnet-path-control', powershell, commandArgs("[Console]::Error.WriteLine('phase:enter'); [System.IO.Path]::GetDirectoryName('C:\\probe\\file.txt'); [Console]::Error.WriteLine('phase:done')")),
            run('dispatcher-explicit-management', powershell, commandArgs(dispatcherScript("Import-Module Microsoft.PowerShell.Management")), builtInEnv),
            run('dispatcher-explicit-management-utility', powershell, commandArgs(dispatcherScript("Import-Module Microsoft.PowerShell.Management; Import-Module Microsoft.PowerShell.Utility")), builtInEnv),
            run('coop-dispatcher', powershell,
              ['-NoLogo', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', join(runtime, 'coop', 'bin', 'coop.ps1'), 'runtime', '--transport', 'http', '--json', '--port', '0', '--cwd', workspace]),
          ];
          const output = join(process.env.RUNNER_TEMP, 'probe9-explicit-modules.json');
          writeFileSync(output, JSON.stringify({ diagnosticOnly: true, candidate: 'ed516b2a183f3e6346344a669d6e37b321a4dcf8', results }, null, 2));
          console.log(JSON.stringify(results.map(({name,status,signal,errorCode,stdout,stderr}) => ({name,status,signal,errorCode,stdoutBytes:stdout.length,stderrBytes:stderr.length,stages:[...stderr.matchAll(/\[coop-startup\] ([^\r\n]+)/g)].map(match => match[1])}))));
          NODE
      - name: Upload explicit-module runtime probe
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: probe9-explicit-modules
          path: ${{ runner.temp }}/probe9-explicit-modules.json
          if-no-files-found: error
      - name: Exercise Windows runtime with the native application's isolated environment
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node --input-type=module - <<'NODE' | tee '${{ runner.temp }}/native-environment-runtime-check.json'
          import { spawnSync } from 'node:child_process';
          import { mkdirSync } from 'node:fs';
          import { join, resolve } from 'node:path';
          import { packagedPaths } from './desktop/scripts/verify-managed-package.mjs';
          const resources = packagedPaths(resolve('desktop/dist-managed')).resources;
          const workspace = join(process.env.RUNNER_TEMP, 'coop-native-environment-workspace');
          mkdirSync(workspace);
          const result = spawnSync(process.execPath, ['scripts/verify-managed-runtime.mjs',
            '--bundle', join(resources, 'managed-runtime'), '--workspace', workspace,
            '--agent', join(process.env.RUNNER_TEMP, 'coop-native-environment-agent'),
            '--environment', 'native'], { stdio: 'inherit' });
          if (result.error) throw result.error;
          process.exitCode = result.status ?? 1;
          NODE
      - name: Launch the native application and verify renderer/chat readiness
        shell: bash
        run: node desktop/scripts/verify-native-application.mjs --output '${{ runner.temp }}/native-application-check.json'
      - name: Build unsigned Windows development installer
        if: runner.os == 'Windows'
        shell: bash
        env:
          COOP_DESKTOP_MANAGED_RUNTIME_DIR: ${{ runner.temp }}/managed-runtime
        run: npm run package:installer:win --prefix desktop
      - name: Verify Windows install, reinstall repair, and uninstall
        if: runner.os == 'Windows'
        shell: bash
        env:
          COOP_DESKTOP_DISPOSABLE_INSTALL_TEST: '1'
        run: node desktop/scripts/verify-windows-installer.mjs --output '${{ runner.temp }}/windows-installer-check.json'
      - name: Preserve Windows installer handoff artifact
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(desktop/dist-installers/*.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "::error::MISSING HANDOFF ARTIFACT: expected exactly 1 installer in desktop/dist-installers, found ${#installers[@]}"
            ls -la desktop/dist-installers || true
            exit 1
          fi
          installer="${installers[0]}"
          sha="$(sha256sum "$installer" | awk '{print $1}')"
          export INSTALLER_NAME="$installer" INSTALLER_SHA256="$sha"
          node - <<'NODE' > desktop/dist-installers/build-identity.json
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('config/release-manifest.json', 'utf8'));
          const companions = JSON.parse(fs.readFileSync('config/development-companions.json', 'utf8'));
          const identity = {
            schema_version: 1,
            desktop_pr_head_sha: process.env.GITHUB_PR_HEAD || process.env.GITHUB_SHA,
            actual_build_sha: process.env.GITHUB_SHA,
            included_terminal_shared_core_revision: process.env.GIT_HEAD || process.env.GITHUB_SHA,
            workflow_run_id: process.env.GITHUB_RUN_ID,
            workflow_run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            target: process.env.TARGET_VALUE,
            runtime_dependency_pins: {
              coop_version: manifest.coop_version,
              node_min: manifest.node && manifest.node.min,
              pi: manifest.pi,
              python_tools: manifest.python_tools,
              mcp_servers: manifest.mcp_servers,
            },
            development_companion_shas: companions,
            signing_status: 'unsigned test candidate (CSC_IDENTITY_AUTO_DISCOVERY=false)',
            installer_filename: process.env.INSTALLER_NAME,
            installer_sha256: process.env.INSTALLER_SHA256,
          };
          console.log(JSON.stringify(identity, null, 2));
          NODE
          cp '${{ runner.temp }}/windows-installer-check.json' desktop/dist-installers/verification-summary.json
          echo "handoff_installer=$installer" >> "$GITHUB_OUTPUT"
          echo "handoff_sha256=$sha" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          GITHUB_SHA: ${{ github.sha }}
          GIT_HEAD: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          TARGET_VALUE: ${{ steps.target.outputs.value }}
        id: installer_handoff
      - name: Upload Windows installer handoff artifact
        if: runner.os == 'Windows' && always() && steps.installer_handoff.outputs.handoff_sha256 != ''
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-handoff-run${{ github.run_id }}-attempt${{ github.run_attempt }}
          retention-days: 21
          if-no-files-found: error
          path: |
            desktop/dist-installers/*.exe
            desktop/dist-installers/build-identity.json
            desktop/dist-installers/verification-summary.json
      - name: Preserve build and runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: managed-runtime-evidence-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/windows-shell-diagnostics.json
            ${{ runner.temp }}/managed-runtime-check.json
            ${{ runner.temp }}/managed-package-check.json
            ${{ runner.temp }}/packaged-runtime-check.json
            ${{ runner.temp }}/native-environment-runtime-check.json
            ${{ runner.temp }}/native-application-check.json
            ${{ runner.temp }}/windows-installer-check.json
            ${{ runner.temp }}/managed-runtime/manifest.json
            ${{ runner.temp }}/managed-runtime/dependency-inventory.json
            ${{ runner.temp }}/coop-development-wheels/development-wheels.json
      - name: Record unpacked artifact size
        shell: bash
        run: du -sh desktop/dist-managed || true
