name: Windows Terminal workstation acceptance

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-terminal-workstation-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-windows-p0:
    name: Native Windows P0 (automated evidence only)
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'terminal/workstation-acceptance-2026-09-20' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: 295693a3eb08e9988594971d87bc4de751e6b551
      BASELINE_SHA: d60300780b565aabf15b172b2bc32abad12b9ca6
    steps:
      - name: Checkout acceptance harness identity
        uses: actions/checkout@v5
        with:
          path: harness
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout immutable Terminal candidate
        uses: actions/checkout@v5
        with:
          ref: 295693a3eb08e9988594971d87bc4de751e6b551
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout immutable v0.23.1 source baseline
        uses: actions/checkout@v5
        with:
          ref: d60300780b565aabf15b172b2bc32abad12b9ca6
          path: baseline
          fetch-depth: 1
          persist-credentials: false

      - name: Parse acceptance harness under Windows PowerShell 5.1
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\harness\acceptance\windows-terminal-workstation.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: Establish current-run upload identity
        shell: powershell
        run: |
          $nonce = [guid]::NewGuid().ToString('N')
          "RUN_NONCE=$nonce" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RECEIPT_UPLOADABLE=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EVIDENCE_UPLOADABLE=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Exercise ownership faults and Unicode transport
        shell: powershell
        run: |
          python .\harness\tests\knowledge-git.test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-name-pattern "Unicode|lifecycle" .\harness\tests\terminal-workstation-acceptance.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run native acceptance (cannot close human gate)
        shell: powershell
        run: |
          $owned = Join-Path $env:RUNNER_TEMP 'coop-terminal-p0-owned'
          $evidence = Join-Path $owned 'evidence'
          $receipt = Join-Path $owned 'terminal-workstation-receipt.json'
          "RECEIPT_PATH=$receipt" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File `
            .\harness\acceptance\windows-terminal-workstation.ps1 `
            -Mode Run `
            -HarnessRoot (Resolve-Path .\harness) `
            -CandidateRoot (Resolve-Path .\candidate) `
            -BaselineRoot (Resolve-Path .\baseline) `
            -EvidenceRoot $evidence `
            -ReceiptPath $receipt `
            -RunNonce $env:RUN_NONCE `
            -ExpectedHarnessSha '${{ github.sha }}'
          $harnessRc = $LASTEXITCODE
          if ($harnessRc -ne 0) { exit $harnessRc }

      - name: Validate fail-closed receipt
        if: always()
        shell: powershell
        run: |
          if (-not $env:RECEIPT_PATH -or -not (Test-Path -LiteralPath $env:RECEIPT_PATH)) {
            throw 'acceptance receipt was not emitted'
          }
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File `
            .\harness\acceptance\windows-terminal-workstation.ps1 `
            -Mode ValidateReceipt -ReceiptPath $env:RECEIPT_PATH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --yes --package ajv-cli@5.0.0 --package ajv-formats@3.0.1 ajv validate `
            --spec=draft2020 -c ajv-formats `
            -s .\harness\acceptance\terminal-workstation-receipt.schema.json `
            -d $env:RECEIPT_PATH
          if ($LASTEXITCODE -ne 0) { throw 'committed JSON Schema rejected the receipt' }
          $receipt = Get-Content -LiteralPath $env:RECEIPT_PATH -Raw | ConvertFrom-Json
          if ($receipt.terminal_workstation_ready -ne $false) {
            throw 'automated workflow must never set TERMINAL_WORKSTATION_READY'
          }
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File `
            .\harness\acceptance\windows-terminal-workstation.ps1 `
            -Mode ValidateUploadAuthorization -AuthorizationKind Receipt `
            -ReceiptPath $env:RECEIPT_PATH -RunNonce $env:RUN_NONCE `
            -ExpectedHarnessSha '${{ github.sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'current receipt upload authorization failed' }
          "RECEIPT_UPLOADABLE=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (Test-Path -LiteralPath "$env:RECEIPT_PATH.evidence-authorization.json" -PathType Leaf) {
            powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File `
              .\harness\acceptance\windows-terminal-workstation.ps1 `
              -Mode ValidateUploadAuthorization -AuthorizationKind Evidence `
              -ReceiptPath $env:RECEIPT_PATH -EvidenceRoot "${{ runner.temp }}\coop-terminal-p0-owned\evidence" `
              -RunNonce $env:RUN_NONCE -ExpectedHarnessSha '${{ github.sha }}'
            if ($LASTEXITCODE -ne 0) { throw 'current evidence upload authorization failed' }
            "EVIDENCE_UPLOADABLE=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Upload fail-closed receipt
        if: always() && env.RECEIPT_UPLOADABLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terminal-workstation-receipt-${{ github.sha }}
          path: ${{ env.RECEIPT_PATH }}
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

      - name: Upload fully scanned automated evidence
        if: always() && env.EVIDENCE_UPLOADABLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terminal-workstation-automated-${{ github.sha }}
          path: ${{ runner.temp }}/coop-terminal-p0-owned/evidence
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
