name: Windows Terminal workstation acceptance

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full immutable lowercase 40-hex candidate SHA
        required: true
        type: string
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-terminal-workstation-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-windows-p0:
    name: Native Windows P0 (automated evidence only)
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'integration/presentation-2026-09-20' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.candidate_sha }}
      BASELINE_SHA: d60300780b565aabf15b172b2bc32abad12b9ca6
    steps:
      - name: Validate event-authorized candidate input
        shell: powershell
        run: |
          if ($env:CANDIDATE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'event-authorized candidate SHA must be full lowercase 40-hex' }

      - name: Checkout acceptance harness identity
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: harness
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout immutable Terminal candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout immutable v0.23.1 source baseline
        uses: actions/checkout@v5
        with:
          ref: d60300780b565aabf15b172b2bc32abad12b9ca6
          path: baseline
          fetch-depth: 1
          persist-credentials: false

      - name: Verify event-authorized exact checkout identity
        shell: powershell
        run: |
          function Assert-SafeCheckout([string]$path) {
            $full = [System.IO.Path]::GetFullPath($path)
            $root = [System.IO.Path]::GetPathRoot($full)
            $current = $root
            foreach ($part in @(($full.Substring($root.Length)) -split '[\\/]' | Where-Object { $_ })) {
              $current = Join-Path $current $part
              if (-not (Test-Path -LiteralPath $current)) { throw "checkout component missing: $current" }
              $item = Get-Item -LiteralPath $current -Force
              if (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) { throw "checkout reparse ancestry rejected: $($item.FullName)" }
            }
            $pending = New-Object System.Collections.Generic.Stack[string]
            $pending.Push($full)
            while ($pending.Count -gt 0) {
              $directory = $pending.Pop()
              foreach ($item in @(Get-ChildItem -LiteralPath $directory -Force)) {
                if (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) { throw "checkout contains a reparse point: $($item.FullName)" }
                if ($item.PSIsContainer) { $pending.Push($item.FullName) }
              }
            }
          }
          $expected = $env:CANDIDATE_SHA
          if ($expected -cnotmatch '^[0-9a-f]{40}$') { throw 'event-authorized candidate SHA must be full lowercase 40-hex' }
          $harness = Join-Path $env:GITHUB_WORKSPACE 'harness'
          $candidate = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $baseline = Join-Path $env:GITHUB_WORKSPACE 'baseline'
          foreach ($checkout in @($harness,$candidate,$baseline)) { Assert-SafeCheckout $checkout }
          foreach ($checkout in @($harness,$candidate)) {
            $observed = (& git -C $checkout rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $observed -cne $expected) { throw "checkout identity mismatch for ${checkout}: expected $expected observed $observed" }
          }
          $baselineObserved = (& git -C $baseline rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $baselineObserved -cne 'd60300780b565aabf15b172b2bc32abad12b9ca6') { throw 'baseline checkout identity mismatch' }
          $version = (Get-Content -LiteralPath (Join-Path $candidate 'VERSION') -Raw).Trim()
          $module = (New-Object System.Uri((Join-Path $harness 'lib\support-center.mjs'))).AbsoluteUri
          $code = "import {fingerprintBuild} from '$module';const r=fingerprintBuild({version:process.argv[1],commit:process.argv[2]});if(!r.ok)process.exit(2);console.log(r.value)"
          $build = (& node --input-type=module -e $code $version $expected | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $build -cnotmatch '^build-[0-9a-f]{8}$') { throw 'candidate Support build fingerprint could not be computed' }
          "VERIFIED_CANDIDATE_SHA=$expected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VERIFIED_CANDIDATE_BUILD=$build" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Parse acceptance harness under Windows PowerShell 5.1
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\harness\acceptance\windows-terminal-workstation.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: Pin runner Python for certification
        shell: powershell
        run: |
          $python = (& .\harness\acceptance\windows-terminal-workstation.ps1 -Mode Probe -Probe ResolvePython | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $python) { exit 1 }
          & $python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CERT_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Split-Path -Parent $python) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Establish current-run upload identity
        shell: powershell
        run: |
          $nonce = [guid]::NewGuid().ToString('N')
          $canary = 'COOP-ACCEPTANCE-CANARY-' + [guid]::NewGuid().ToString('N')
          "RUN_NONCE=$nonce" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EVIDENCE_CANARY=$canary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install receipt-schema test dependency
        shell: powershell
        run: |
          & $env:CERT_PYTHON -m pip install --disable-pip-version-check --no-input "jsonschema==4.25.1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:CERT_PYTHON -c "import jsonschema"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise ownership faults and Unicode transport
        shell: powershell
        run: |
          & $env:CERT_PYTHON .\harness\tests\knowledge-git.test.py `
            KnowledgeGitOwnershipTests.test_create_failure_reaches_adopt_and_stops_suspended_child `
            KnowledgeGitOwnershipTests.test_assignment_failure_reaches_adopt_and_closes_job `
            KnowledgeGitOwnershipTests.test_resume_failure_reaches_adopt_and_closes_owned_job_without_pid_fallback `
            KnowledgeGitOwnershipTests.test_query_failure_is_uncertain_not_empty `
            KnowledgeGitOwnershipTests.test_termination_and_close_faults_report_failure `
            KnowledgeGitOwnershipTests.test_close_uncertainty_overrides_payload_success
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test --test-name-pattern "Unicode|lifecycle|directory links|junctioned ancestor|authorization revocation|failure cleanup|checkout ancestry|owned-root probe|fully safe authorization|decisive receipt mutations" .\harness\tests\terminal-workstation-acceptance.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run native acceptance (cannot close human gate)
        shell: powershell
        run: |
          $owned = Join-Path $env:RUNNER_TEMP "coop-terminal-p0-$env:VERIFIED_CANDIDATE_SHA-$env:VERIFIED_CANDIDATE_BUILD"
          $evidence = Join-Path $owned 'evidence'
          $receipt = Join-Path $owned "terminal-workstation-receipt-$env:VERIFIED_CANDIDATE_SHA-$env:VERIFIED_CANDIDATE_BUILD.json"
          "OWNED_PATH=$owned" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EVIDENCE_PATH=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RECEIPT_PATH=$receipt" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $harnessRoot = Join-Path $env:GITHUB_WORKSPACE 'harness'
          $candidateRoot = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $baselineRoot = Join-Path $env:GITHUB_WORKSPACE 'baseline'
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File `
            .\harness\acceptance\windows-terminal-workstation.ps1 `
            -Mode Run `
            -HarnessRoot $harnessRoot `
            -CandidateRoot $candidateRoot `
            -BaselineRoot $baselineRoot `
            -EvidenceRoot $evidence `
            -ReceiptPath $receipt `
            -RunNonce $env:RUN_NONCE `
            -Canary $env:EVIDENCE_CANARY `
            -ExpectedHarnessSha $env:VERIFIED_CANDIDATE_SHA `
            -ExpectedCandidateSha $env:VERIFIED_CANDIDATE_SHA `
            -ExpectedCandidateBuild $env:VERIFIED_CANDIDATE_BUILD
          $harnessRc = $LASTEXITCODE
          if ($harnessRc -ne 0) { exit $harnessRc }

      - name: Report closed Doctor failure categories
        if: failure()
        shell: powershell
        run: |
          # Diagnostic branch only: print closed categories, never raw evidence.
          # The tested harness and candidate still come from candidate_sha.
          # Failed runs intentionally delete evidence. Re-probe the retained owned
          # installation without changing the harness or retaining raw output.
          if (-not $env:OWNED_PATH) { throw 'Owned installation path unavailable' }
          $full = [System.IO.Path]::GetFullPath($env:OWNED_PATH)
          $current = [System.IO.Path]::GetPathRoot($full)
          foreach ($part in @($full.Substring($current.Length) -split '[\\/]' | Where-Object { $_ })) {
            $current = Join-Path $current $part
            $item = Get-Item -LiteralPath $current -Force -ErrorAction Stop
            if (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Linked Doctor evidence refused' }
          }
          $profile = Join-Path $full 'profile'
          $npm = Join-Path $full 'npm-global'
          $pipxBin = Join-Path $full 'pipx-bin'
          $localApp = Join-Path $full 'local-app-data'
          $env:HOME = $profile
          $env:USERPROFILE = $profile
          $env:HOMEDRIVE = (Split-Path -Qualifier $profile)
          $env:HOMEPATH = $profile.Substring($env:HOMEDRIVE.Length)
          $env:LOCALAPPDATA = $localApp
          $env:APPDATA = Join-Path $full 'roaming-app-data'
          $env:COOP_DIR = $profile
          $env:COOP_AGENT_DIR = Join-Path $profile '.coop\agent'
          $env:PIPX_HOME = Join-Path $full 'pipx-home'
          $env:PIPX_BIN_DIR = $pipxBin
          $env:npm_config_prefix = $npm
          $env:COOP_NO_ONBOARD = '1'
          $env:COOP_NO_MODEL_LOGIN = '1'
          $env:PATH = "$npm;$pipxBin;$(Join-Path $localApp 'coop\bin');$($env:PATH)"
          [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding($false)
          $doctorOutput = @(powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\candidate\scripts\doctor.ps1 --json 2>$null)
          $doctorLine = @($doctorOutput | Where-Object { ([string]$_).StartsWith('{"checks"') })
          if ($doctorLine.Count -ne 1) { throw 'Doctor did not return one recognizable document' }
          $doctor = $doctorLine[0] | ConvertFrom-Json
          $codes = @()
          foreach ($check in @($doctor.checks | Where-Object { $_.status -eq 'fail' })) {
            $name = [string]$check.name
            $code = switch -Regex ($name) {
              '^Fabric SQL fallback: pyodbc missing' { 'sql-pyodbc-missing'; break }
              '^Fabric SQL fallback: pyodbc .* differs from manifest' { 'sql-pyodbc-version'; break }
              '^Fabric SQL fallback: pyodbc is installed but unloadable' { 'sql-pyodbc-unloadable'; break }
              '^Fabric SQL fallback: ODBC Driver' { 'sql-odbc-driver-missing'; break }
              '^Fabric SQL fallback: selected Fabric Python runtime' { 'sql-python-runtime-missing'; break }
              '^python missing' { 'python-missing'; break }
              '^pipx missing' { 'pipx-missing'; break }
              '^pi missing' { 'pi-missing'; break }
              '^git missing' { 'git-missing'; break }
              '^fab missing' { 'fabric-cli-missing'; break }
              '^fab is the WRONG tool' { 'fabric-cli-collision'; break }
              'pipx environment is stale/corrupt' { 'pipx-runtime-mismatch'; break }
              default { 'unclassified-required-check' }
            }
            $codes += $code
          }
          [ordered]@{ diagnostic = 'candidate-doctor'; fail = [int]$doctor.fail; categories = $codes } | ConvertTo-Json -Compress

      - name: Run exact-candidate behavioral tests under Windows PowerShell 5.1
        id: exact_behavioral_suite
        shell: powershell
        working-directory: candidate
        run: |
          $harnessRoot = Join-Path $env:GITHUB_WORKSPACE 'harness'
          $candidateRoot = Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $baselineRoot = Join-Path $env:GITHUB_WORKSPACE 'baseline'
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File `
            ..\harness\acceptance\windows-terminal-workstation.ps1 `
            -Mode RunBehavioralSuite `
            -HarnessRoot $harnessRoot `
            -CandidateRoot $candidateRoot `
            -BaselineRoot $baselineRoot `
            -EvidenceRoot $env:EVIDENCE_PATH `
            -ReceiptPath $env:RECEIPT_PATH `
            -RunNonce $env:RUN_NONCE `
            -Canary $env:EVIDENCE_CANARY `
            -ExpectedHarnessSha $env:VERIFIED_CANDIDATE_SHA `
            -ExpectedCandidateSha $env:VERIFIED_CANDIDATE_SHA `
            -ExpectedCandidateBuild $env:VERIFIED_CANDIDATE_BUILD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate fail-closed receipt
        id: validate_artifacts
        if: always() && steps.exact_behavioral_suite.outcome == 'success'
        shell: powershell
        run: |
          if (-not $env:RECEIPT_PATH) { throw 'acceptance receipt path was not emitted' }
          $identity = @('-ExpectedHarnessSha',$env:VERIFIED_CANDIDATE_SHA,'-ExpectedCandidateSha',$env:VERIFIED_CANDIDATE_SHA,'-ExpectedCandidateBuild',$env:VERIFIED_CANDIDATE_BUILD)
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File `
            .\harness\acceptance\windows-terminal-workstation.ps1 `
            -Mode ValidateReceipt -ReceiptPath $env:RECEIPT_PATH @identity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --yes --package ajv-cli@5.0.0 --package ajv-formats@3.0.1 ajv validate `
            --spec=draft2020 -c ajv-formats `
            -s .\harness\acceptance\terminal-workstation-receipt.schema.json `
            -d $env:RECEIPT_PATH
          if ($LASTEXITCODE -ne 0) { throw 'committed JSON Schema rejected the receipt' }
          $receipt = Get-Content -LiteralPath $env:RECEIPT_PATH -Raw | ConvertFrom-Json
          if ($receipt.terminal_workstation_ready -ne $false) {
            throw 'automated workflow must never set TERMINAL_WORKSTATION_READY'
          }
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File `
            .\harness\acceptance\windows-terminal-workstation.ps1 `
            -Mode ValidateUploadAuthorization -AuthorizationKind Receipt `
            -ReceiptPath $env:RECEIPT_PATH -RunNonce $env:RUN_NONCE @identity
          if ($LASTEXITCODE -ne 0) { throw 'current receipt upload authorization failed' }
          "receipt_uploadable=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File `
            .\harness\acceptance\windows-terminal-workstation.ps1 `
            -Mode ValidateUploadAuthorization -AuthorizationKind Evidence `
            -ReceiptPath $env:RECEIPT_PATH -EvidenceRoot $env:EVIDENCE_PATH `
            -RunNonce $env:RUN_NONCE @identity
          if ($LASTEXITCODE -ne 0) { throw 'current evidence upload authorization failed' }
          "evidence_uploadable=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload fail-closed receipt
        if: always() && steps.exact_behavioral_suite.outcome == 'success' && steps.validate_artifacts.outcome == 'success' && steps.validate_artifacts.outputs.receipt_uploadable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terminal-workstation-receipt-${{ env.VERIFIED_CANDIDATE_SHA }}-${{ env.VERIFIED_CANDIDATE_BUILD }}
          path: ${{ env.RECEIPT_PATH }}
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

      - name: Upload fully scanned automated evidence
        if: always() && steps.exact_behavioral_suite.outcome == 'success' && steps.validate_artifacts.outcome == 'success' && steps.validate_artifacts.outputs.evidence_uploadable == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: terminal-workstation-automated-${{ env.VERIFIED_CANDIDATE_SHA }}-${{ env.VERIFIED_CANDIDATE_BUILD }}
          path: ${{ env.EVIDENCE_PATH }}
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
