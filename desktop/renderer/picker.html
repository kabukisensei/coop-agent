<!doctype html>
<html lang="en" data-theme="modern-dark" data-style="modern">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>coop - client folder</title>
  <link rel="stylesheet" href="styles/themes.css">
  <link rel="stylesheet" href="styles/app.css">
  <script type="module" src="picker.mjs"></script>
</head>
<body class="picker-body">
  <main class="picker" aria-label="Where is this client's code?">
    <header class="picker-head">
      <span class="brand"><span class="brand-mark" aria-hidden="true"></span>coop</span>
      <h1 class="picker-title" id="pickerTitle">Where is this client's code?</h1>
      <p class="picker-lead">Choose the folder that holds the client's repositories. coop opens there every time and finds the team's project file inside it.</p>
      <p class="picker-lead">This Windows account is one client. Its sessions, memory and backups stay in this account.</p>
    </header>
    <p id="pickerCurrent" class="picker-current" hidden></p>
    <footer class="picker-foot">
      <span class="picker-spacer"></span>
      <button type="button" id="cancel" class="btn ghost">Cancel</button>
      <button type="button" id="choose" class="btn primary">Choose folder...</button>
    </footer>
  </main>
</body>
</html>
