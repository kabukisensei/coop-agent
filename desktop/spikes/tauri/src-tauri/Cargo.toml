[package]
name = "coop-desktop-tauri-spike"
version = "0.0.1"
description = "Measured Tauri architecture spike for Coop Desktop"
authors = ["Cooptimize"]
edition = "2021"

[lib]
name = "coop_desktop_tauri_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rfd = "0.15"
